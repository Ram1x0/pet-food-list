<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="図鑑">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<title>かわいい図鑑ツール</title>

<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:12px;
  font-family:'Mochiy Pop One', sans-serif;
  background:linear-gradient(#fbcfe8,#93c5fd);
  color:#1e293b;
}

/* タイトル */
h1{
  text-align:center;
  font-size:20px;
}

/* パネル */
.card{
  background:white;
  border-radius:16px;
  padding:12px;
  margin-top:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* 天気 */
.weather{
  text-align:center;
  font-size:22px;
  margin-bottom:6px;
}

.time{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}

/* 検索 */
.search{
  width:100%;
  padding:8px;
  border-radius:10px;
  border:none;
  background:#f1f5f9;
  margin-bottom:8px;
  box-sizing:border-box; /* はみ出し防止 */
}

/* フィルター */
.filter{
  display:flex;
  gap:6px;
}

.filter button{
  flex:1;
  padding:6px;
  border:none;
  border-radius:12px;
  background:#e0f2fe;
}

.active{
  background:#38bdf8;
  color:white;
}

/* グリッド（4列） */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

/* アイテム */
.item{
  background:#f8fafc;
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:12px;
  transition:0.2s;
}

.item:active{
  transform:scale(0.95);
}

/* 画像見やすく */
.item img{
  width:100%;
  height:70px;
  object-fit:contain;
  background:white;
  border-radius:8px;
  padding:4px;
}

/* 検索バーバツボタン */
#clearBtn{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:transparent;
  font-size:18px;
  display:none; /* 最初は非表示 */
}

/* モーダル */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
}

.modal-box{
  background:white;
  margin:60px auto;
  padding:16px;
  width:90%;
  max-width:300px;
  border-radius:16px;
  text-align:center;
}

.sticky{
  position: sticky;
  top: 0;
  z-index: 100;
  background: white; /* ←重要：透け防止 */
}

#list{
  margin-top: 8px;
}
</style>
</head>

<body>

<h1>🎀 出現図鑑</h1>

<div class="card sticky">
  <div id="time" class="time"></div>
  <div id="weather" class="weather"></div>

<div style="position:relative;">
  <input type="text" id="search" class="search" placeholder="🔍 名前で検索">
  <button id="clearBtn">×</button>
</div>

  <div class="filter">
    <button onclick="setFilter('all')" id="f_all">全部</button>
    <button onclick="setFilter('fish')" id="f_fish">魚</button>
    <button onclick="setFilter('bug')" id="f_bug">虫</button>
    <button onclick="setFilter('bird')" id="f_bird">野鳥</button>
  </div>

  <div class="filter" style="margin-top:6px;">
    <button onclick="setWeatherMode('current')" id="w_current">今出現するもの全て</button>
    <button onclick="setWeatherMode('only')" id="w_only">今の天気でしか出現しない</button>
  </div>

</div>

  <div id="list" class="grid"></div>

<!-- モーダル -->
<div id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box">
    <h3 id="m_name"></h3>
    <img id="m_img" style="width:100%;height:100px;object-fit:contain;">
    <p id="m_loc"></p>
    <p id="m_weather"></p>
    <p id="m_time"></p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

const creatures = [
 ...fishData,
 ...bugData,
 ...birdData
];

// 時間帯取得
function getZone(){
 const h=new Date().getHours();
 if(h>=6&&h<12)return"6-12";
 if(h>=12&&h<18)return"12-18";
 if(h>=18&&h<24)return"18-24";
 return"0-6";
}

// フォーマット
function formatTime(arr){
 const order=["6-12","12-18","18-24","0-6"];
 if(arr.length===4)return"全時間";

 const sorted=order.filter(o=>arr.includes(o));
 const ranges=[];
 let start=null,prev=null;

 sorted.forEach((zone,i)=>{
  const[s,e]=zone.split("-");
  if(start===null){start=s;prev=e;return;}

  if(prev===s){prev=e;}
  else{
   ranges.push([start,prev]);
   start=s;prev=e;
  }

  if(i===sorted.length-1){
   ranges.push([start,prev]);
  }
 });

 return ranges.map(([s,e])=>{
  if(e==="24")e="0";
  return `${s}〜${e}`;
 }).join(" / ");
}

function formatWeather(arr){
 const all=["晴れ","雨","虹"];
 if(arr.length===all.length)return"全天気";
 return arr.join("・");
}

const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

// 入力時
searchInput.addEventListener("input", ()=>{
  clearBtn.style.display = searchInput.value ? "block" : "none";
  render();
});

// ×ボタン
clearBtn.onclick = ()=>{
  searchInput.value = "";
  clearBtn.style.display = "none";
  render();
};

// 表示
function render(){

 if(!currentWeather || !currentZone) return;

 let list = creatures.filter(c => {

  // 全天気 or 一致
  let weatherMatch = false;

  if(weatherMode === "current"){
  // 今の天気で出るやつ全部（全天気含む）
  weatherMatch =
    c.weather.length === ALL_WEATHER.length ||
    c.weather.includes(currentWeather);

  }else if(weatherMode === "only"){
  // 今の天気でしか出ないやつ
  weatherMatch =
    c.weather.length === 1 &&
    c.weather[0] === currentWeather;
}

  // 全時間 or 一致
  const timeMatch =
    c.time.length === ALL_TIME.length ||
    c.time.includes(currentZone);

  return weatherMatch && timeMatch;
});

 // フィルター
 if(currentFilter!=="all"){
  list=list.filter(c=>c.type===currentFilter);
 }

 // 検索
 const keyword=document.getElementById("search").value;
 if(keyword){
  list=list.filter(c=>c.name.includes(keyword));
 }

 const el=document.getElementById("list");
 el.innerHTML="";

 // 出現なし
 if(list.length===0){
  el.innerHTML="<p>出現なし</p>";
  return;
 }

 list.forEach(c=>{
  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <img src="${c.img}" loading="lazy">
   <div>${c.name}</div>
  `;

  div.onclick=()=>openModal(c);
  el.appendChild(div);
 });
}

let lastZone=getZone();

function updateTime(){
 const now = new Date();
 const zone = getZone();

 const todayKey = getDateKey(0);
 const tomorrowKey = getDateKey(1);

 const todayWeather = weatherData[todayKey] || {};
 const weather = todayWeather[zone] || "不明";

 // ここで変化チェック
 const changed = (zone !== currentZone) || (weather !== currentWeather);

 currentZone = zone;
 currentWeather = weather;

 // 次の天気（そのままでOK）
 const zones = ["6-12","12-18","18-24","0-6"];
 const nextIndex = (zones.indexOf(zone)+1) % 4;
 const nextZone = zones[nextIndex];

 let nextWeather;

 if(nextZone === "0-6"){
   const tomorrowWeather = weatherData[tomorrowKey] || {};
   nextWeather = tomorrowWeather[nextZone] || "不明";
 }else{
   nextWeather = todayWeather[nextZone] || "不明";
 }

 document.getElementById("time").innerText = now.toLocaleTimeString();
 document.getElementById("weather").innerText =
   `今：${weather} / 次：${nextWeather}`;

 // 👇 変化した時だけrender
 if(changed){
   render();
 }
}

// 今日の日付取得
function getDateKey(offset=0){
  const d = new Date();

  // JSTに補正（+9時間）
  d.setHours(d.getHours() + 9);

  d.setDate(d.getDate() + offset);

  return d.toISOString().slice(0,10);
}
  
// 切替関数
function setWeatherMode(mode){
  weatherMode = mode;

  ["current","only"].forEach(x=>{
    document.getElementById("w_"+x).classList.remove("active");
  });

  document.getElementById("w_"+mode).classList.add("active");

  render();
}

// フィルター
function setFilter(t){
 currentFilter=t;
 ["all","fish","bug","bird"].forEach(x=>{
  document.getElementById("f_"+x).classList.remove("active");
 });
 document.getElementById("f_"+t).classList.add("active");
 render();
}

// 検索
document.getElementById("search").addEventListener("input",render);

// モーダル
function openModal(c){
 modal.style.display="block";
 m_name.innerText=c.name;
 m_img.src=c.img;
 m_loc.innerText=c.location;
 m_weather.innerText="天気："+formatWeather(c.weather);
 m_time.innerText="時間："+formatTime(c.time);
}
function closeModal(){
 modal.style.display="none";
}

// 初期化
updateTime();        // ←先に状態作る
setFilter("all");    // ←ここで初回render
setInterval(updateTime,1000);
setWeatherMode("current");
</script>
