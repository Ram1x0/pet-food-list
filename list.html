<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>かわいい図鑑ツール</title>

<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:12px;
  font-family:'Mochiy Pop One', sans-serif;
  background:linear-gradient(#fbcfe8,#93c5fd);
  color:#1e293b;
}

/* タイトル */
h1{
  text-align:center;
  font-size:20px;
}

/* パネル */
.card{
  background:white;
  border-radius:16px;
  padding:12px;
  margin-top:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* 天気 */
.weather{
  text-align:center;
  font-size:22px;
  margin-bottom:6px;
}

.time{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}

/* 検索 */
.search{
  width:100%;
  padding:8px;
  border-radius:10px;
  border:none;
  background:#f1f5f9;
  margin-bottom:8px;
  box-sizing:border-box; /* はみ出し防止 */
}

/* フィルター */
.filter{
  display:flex;
  gap:6px;
}

.filter button{
  flex:1;
  padding:6px;
  border:none;
  border-radius:12px;
  background:#e0f2fe;
}

.active{
  background:#38bdf8;
  color:white;
}

/* グリッド（4列） */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

/* アイテム */
.item{
  background:#f8fafc;
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:12px;
  transition:0.2s;
}

.item:active{
  transform:scale(0.95);
}

/* 画像見やすく */
.item img{
  width:100%;
  height:70px;
  object-fit:contain;
  background:white;
  border-radius:8px;
  padding:4px;
}

/* モーダル */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
}

.modal-box{
  background:white;
  margin:60px auto;
  padding:16px;
  width:90%;
  max-width:300px;
  border-radius:16px;
  text-align:center;
}
</style>
</head>

<body>

<h1>🎀 出現図鑑</h1>

<div class="card">
  <div id="time" class="time"></div>
  <div id="weather" class="weather"></div>

  <input type="text" id="search" class="search" placeholder="🔍 名前で検索">

  <div class="filter">
    <button onclick="setFilter('all')" id="f_all">全部</button>
    <button onclick="setFilter('fish')" id="f_fish">魚</button>
    <button onclick="setFilter('bug')" id="f_bug">虫</button>
    <button onclick="setFilter('bird')" id="f_bird">野鳥</button>
  </div>

  <div id="list" class="grid"></div>
</div>

<!-- モーダル -->
<div id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box">
    <h3 id="m_name"></h3>
    <img id="m_img" style="width:100%;height:100px;object-fit:contain;">
    <p id="m_loc"></p>
    <p id="m_weather"></p>
    <p id="m_time"></p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
let currentFilter="all";

// 天気
const weatherData={
 "6-12":"晴れ",
 "12-18":"雨",
 "18-24":"虹",
 "0-6":"晴れ"
};

// データ
const creatures=[
{
 name:"マアジ",
 type:"fish",
 weather:["晴れ","雨","虹"],
 time:["6-12","12-18","18-24","0-6"],
 location:"🌊 海",
 img:"images/048.PNG"
},
{
 name:"タラバガニ",
 type:"fish",
 weather:["虹"],
 time:["6-12","12-18","18-24","0-6"],
 location:"🌊 深海",
 img:"images/050.PNG"
}
];

// 時間帯取得
function getZone(){
 const h=new Date().getHours();
 if(h>=6&&h<12)return"6-12";
 if(h>=12&&h<18)return"12-18";
 if(h>=18&&h<24)return"18-24";
 return"0-6";
}

// フォーマット
function formatTime(arr){
 const order=["6-12","12-18","18-24","0-6"];
 if(arr.length===4)return"全時間";

 const sorted=order.filter(o=>arr.includes(o));
 const ranges=[];
 let start=null,prev=null;

 sorted.forEach((zone,i)=>{
  const[s,e]=zone.split("-");
  if(start===null){start=s;prev=e;return;}

  if(prev===s){prev=e;}
  else{
   ranges.push([start,prev]);
   start=s;prev=e;
  }

  if(i===sorted.length-1){
   ranges.push([start,prev]);
  }
 });

 return ranges.map(([s,e])=>{
  if(e==="24")e="0";
  return `${s}〜${e}`;
 }).join(" / ");
}

function formatWeather(arr){
 const all=["晴れ","雨","虹"];
 if(arr.length===all.length)return"全天気";
 return arr.join("・");
}

// 表示
function render(){

 const zone=getZone();
 const weather=weatherData[zone];

 let list=creatures.filter(c=>
  c.weather.includes(weather)&&
  c.time.includes(zone)
 );

 // フィルター
 if(currentFilter!=="all"){
  list=list.filter(c=>c.type===currentFilter);
 }

 // 検索
 const keyword=document.getElementById("search").value;
 if(keyword){
  list=list.filter(c=>c.name.includes(keyword));
 }

 const el=document.getElementById("list");
 el.innerHTML="";

 // 出現なし
 if(list.length===0){
  el.innerHTML="<p>出現なし</p>";
  return;
 }

 list.forEach(c=>{
  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <img src="${c.img}" loading="lazy">
   <div>${c.name}</div>
  `;

  div.onclick=()=>openModal(c);
  el.appendChild(div);
 });
}

let lastZone=getZone();

function updateTime(){
 const now=new Date();
 const zone=getZone();
 const weather=weatherData[zone];

 document.getElementById("time").innerText=now.toLocaleTimeString();
 document.getElementById("weather").innerText="天気："+weather;

 if(zone!==lastZone){
  lastZone=zone;
  render();
 }
}

// フィルター
function setFilter(t){
 currentFilter=t;
 ["all","fish","bug","bird"].forEach(x=>{
  document.getElementById("f_"+x).classList.remove("active");
 });
 document.getElementById("f_"+t).classList.add("active");
 render();
}

// 検索
document.getElementById("search").addEventListener("input",render);

// モーダル
function openModal(c){
 modal.style.display="block";
 m_name.innerText=c.name;
 m_img.src=c.img;
 m_loc.innerText=c.location;
 m_weather.innerText="天気："+formatWeather(c.weather);
 m_time.innerText="時間："+formatTime(c.time);
}
function closeModal(){
 modal.style.display="none";
}

// 初期化
setFilter("all");
render();
updateTime();
setInterval(updateTime,1000);
</script>

</body>
</html>
