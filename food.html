<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料理ツール</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
}

.search-bar {
  position: sticky;
  top: 0;
  background: white;
  padding: 10px;
  z-index: 1000;
}

.search-wrapper {
  position: relative;
}

.search-wrapper input {
  width: 100%;
  padding: 12px 40px 12px 12px;
}

.clear-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: none;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 10px;
}

.card {
  background: white;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  display: flex;
  gap: 10px;
}

.card img {
  width: 70px;
  height: 70px;
  border-radius: 10px;
}

.detail {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 5px;
}

.hidden { display:none; }

.high { color:green; font-weight:bold; }
.low { color:#888; }
</style>
</head>

<body>

<div class="search-bar">
  <div class="search-wrapper">
    <input type="text" id="search" placeholder="料理名で検索..." oninput="filterFoods()">
    <button class="clear-btn" onclick="clearSearch()">×</button>
  </div>
</div>

<div class="container">

<h2>🍳 料理一覧</h2>

<select id="starSelect" onchange="renderList()">
  <option value="0">★1</option>
  <option value="1">★2</option>
  <option value="2">★3</option>
  <option value="3">★4</option>
  <option value="4">★5</option>
</select>

<button onclick="sortByHourly()">時給順</button>

<div id="list"></div>

<h2>⚔️ 比較</h2>
<select id="foodA"></select>
<select id="foodB"></select>
<button onclick="compare()">比較する</button>

<div id="compareResult"></div>

</div>

<script>

const foods = [
{
  name:"ブルーベリージャム",
  image:"foods/blueberry.jpg",
  cost:0,
  time:1, // 修正（仮）
  prices:[170,255,340,680,1360],
  materials:["ブルーベリー×4"]
},
{
  name:"コーンポタージュ",
  image:"foods/corn.jpg",
  cost:540,
  time:720,
  prices:[1340,2010,2680,5360,10720],
  materials:["牛乳×1","バター×1","トウモロコシ×2"]
},
{
  name:"トリュフパイ",
  image:"foods/truffle_pie.jpg",
  cost:195,
  time:240,
  prices:[830,1245,1660,3320,6640],
  materials:["トリュフ×2","小麦×1","卵×1"]
},
{
  name:"トリュフパスタ",
  image:"foods/truffle_pasta.jpg",
  cost:290,
  time:240,
  prices:[900,1350,1800,3600,7200],
  materials:["トリュフ×1","小麦×2","牛乳×1"]
},
{
  name:"コーヒー",
  image:"foods/coffee.jpg",
  cost:200,
  time:1,
  prices:[290,435,580,1160,2320],
  materials:["コーヒー豆×4"]
}
];

let filteredFoods=[...foods];
const list=document.getElementById("list");

// ▼ 時給計算
function calcHourly(f, star){
  const price = f.prices[star];
  const profit = price - f.cost;

  if(!f.time || f.time <= 0) return 0;

  return Math.round((profit / f.time) * 60);
}

// ▼ 描画
function renderList(){
  list.innerHTML="";
  const star = document.getElementById("starSelect").value;

  filteredFoods.forEach((f,i)=>{

    const price = f.prices[star];
    const profit = price - f.cost;
    const hourly = calcHourly(f, star);

    const colorClass = hourly > 1000 ? "high" : "low";

    list.innerHTML+=`
    <div class="card" onclick="toggleDetail(${i})">
      <img src="${f.image}">
      <div>
        <b>${f.name}</b><br>
        利益:${profit}<br>
        <span class="${colorClass}">時給:${hourly}</span>
      </div>
    </div>

    <div id="detail${i}" class="detail hidden">
      <b>売価</b><br>
      ${f.prices.map((p,i)=>`★${i+1}:${p}`).join("<br>")}
      <br><br>
      <b>素材</b><br>
      ${f.materials.join("<br>")}
    </div>
    `;
  });
}

renderList();

// ▼ ソート
function sortByHourly(){
  const star = document.getElementById("starSelect").value;

  filteredFoods.sort((a,b)=>{
    return calcHourly(b,star) - calcHourly(a,star);
  });

  renderList();
}

// 詳細
function toggleDetail(i){
  document.getElementById("detail"+i).classList.toggle("hidden");
}

// 検索
function filterFoods(){
  const input=document.getElementById("search");
  const keyword=input.value.toLowerCase();
  const btn=document.querySelector(".clear-btn");

  btn.style.display=keyword?"block":"none";

  filteredFoods=foods.filter(f=>f.name.toLowerCase().includes(keyword));
  renderList();
}

// クリア
function clearSearch(){
  document.getElementById("search").value="";
  filteredFoods=[...foods];
  document.querySelector(".clear-btn").style.display="none";
  renderList();
}

// セレクト
const selectA=document.getElementById("foodA");
const selectB=document.getElementById("foodB");

foods.forEach((f,i)=>{
  selectA.innerHTML+=`<option value="${i}">${f.name}</option>`;
  selectB.innerHTML+=`<option value="${i}">${f.name}</option>`;
});

// 比較
function compare(){

  const star = document.getElementById("starSelect").value;

  const a=foods[selectA.value];
  const b=foods[selectB.value];

  const hourlyA = calcHourly(a,star);
  const hourlyB = calcHourly(b,star);

  let winner = hourlyA > hourlyB ? a.name : b.name;

  document.getElementById("compareResult").innerHTML=`
  <div class="detail">
  🏆 ${winner}<br>
  時給:${hourlyA} vs ${hourlyB}
  </div>`;
}

</script>

</body>
</html>
